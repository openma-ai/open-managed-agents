name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Merge Queue: required check context remains `verify`.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # Graded impact surfaces (#417). Decision table lives in
  # scripts/ci-impact-surfaces.mjs (unit-tested).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      web: ${{ steps.classify.outputs.web }}
      cf: ${{ steps.classify.outputs.cf }}
      node: ${{ steps.classify.outputs.node }}
      meta_only: ${{ steps.classify.outputs.meta_only }}
      # Multi-platform parity gate (design §0.7 gate 4): platforms whose
      # dependency graph a change reaches, from pnpm "...[<merge-base>]".
      parity_cf: ${{ steps.parity.outputs.parity_cf }}
      parity_node: ${{ steps.parity.outputs.parity_node }}
      console_e2e: ${{ steps.console_scope.outputs.console_e2e }}
      console_domains: ${{ steps.console_scope.outputs.console_domains }}
      console_local_specs: ${{ steps.console_scope.outputs.console_local_specs }}
      console_cert_specs: ${{ steps.console_scope.outputs.console_cert_specs }}
      domain_test_commands: ${{ steps.console_scope.outputs.domain_test_commands }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Resolve change list
        id: files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge Queue temporary ref: classify against the queue base SHA.
            BASE="${{ github.event.merge_group.base_sha }}"
            if [[ -z "$BASE" ]]; then
              echo "merge_group.base_sha missing" >&2
              exit 1
            fi
          else
            # Push to main: classify against the previous commit on this ref.
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          git diff --name-only --diff-filter=ACMRD "$BASE"...HEAD > /tmp/ci-changed-files.txt
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Changed files vs $BASE:"
          cat /tmp/ci-changed-files.txt
          if [[ ! -s /tmp/ci-changed-files.txt ]]; then
            echo "No changed files; treating as empty (meta-only)."
          fi

      - name: Classify impact surfaces
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ci-impact-surfaces.test.mjs
          node scripts/ci-impact-surfaces.mjs --write-github-output < /tmp/ci-changed-files.txt

      # Changed files -> owning packages -> reverse dependents -> affected
      # platforms, by pnpm's own "...[<merge-base>]" filter (no install
      # needed; reads the workspace manifests). The merge base is explicit
      # because pnpm 11 has no merge-base comparison (added in v12.7.0,
      # https://pnpm.io/filtering). Root files no package owns (runner files,
      # test/fakes the suite imports) are matched against the change list.
      - name: Select platforms for the parity gate
        id: parity
        shell: bash
        env:
          BASE: ${{ steps.files.outputs.base }}
        run: |
          set -euo pipefail
          MERGE_BASE="$(git merge-base "$BASE" HEAD)"
          echo "parity merge base: $MERGE_BASE"
          node scripts/check-platform-parity.mjs affected --base "$MERGE_BASE" --write-github-output < /tmp/ci-changed-files.txt

      # Console browser E2E is scoped by domain: the changed domain's Console
      # specs and suites for the changed layer plus its adjacent layers
      # (frontend<->backend<->storage/cli/sdk) within the same domain.
      - name: Select Console E2E domains
        id: console_scope
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ci-console-e2e-scope.test.mjs
          node scripts/ci-console-e2e-scope.mjs --write-github-output < /tmp/ci-changed-files.txt

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docs typecheck
        run: pnpm --filter open-managed-agents-docs typecheck

      - name: Docs build
        run: pnpm build:docs

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web typecheck
        run: pnpm --filter @open-managed-agents/web typecheck

      - name: Web test
        run: pnpm test:web

  # Keep the required `cf` check as a small aggregate job. The actual work is
  # split below so workerd remains serialized inside each process while the
  # independent processes run concurrently.
  cf:
    if: always() && (needs.changes.outputs.cf == 'true' || needs.changes.outputs.parity_cf == 'true')
    runs-on: ubuntu-24.04
    needs: [changes, cf-preflight, cf-root, cf-packages]
    timeout-minutes: 5
    steps:
      - name: Require all CF lanes
        run: |
          for lane in \
            "preflight=${{ needs.cf-preflight.result }}" \
            "root=${{ needs.cf-root.result }}" \
            "packages=${{ needs.cf-packages.result }}"; do
            echo "$lane"
            if [[ "$lane" != *=success ]]; then
              echo "CF lane did not pass: $lane" >&2
              exit 1
            fi
          done

  cf-preflight:
    needs: [changes, lint]
    if: needs.changes.outputs.cf == 'true' || needs.changes.outputs.parity_cf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check dependency sources before install
        run: |
          node --test scripts/check-dependency-sources.test.mjs
          node scripts/check-dependency-sources.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CF typecheck
        run: pnpm typecheck:ci:cf

      - name: CF test preflight
        run: pnpm test:ci:cf:preflight

  cf-root:
    needs: [changes, cf-preflight]
    if: needs.changes.outputs.cf == 'true' || needs.changes.outputs.parity_cf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CF root tests (shard ${{ matrix.shard }}/4)
        env:
          # Keep workerd serialized inside every shard. The speedup comes from
          # independent processes, without reintroducing teardown races.
          OMA_CF_VITEST_MAX_WORKERS: 1
          OMA_CF_VITEST_SERIAL: "1"
          OMA_CF_VITEST_VERBOSE: "1"
        run: |
          set -o pipefail
          pnpm exec vitest run --shard=${{ matrix.shard }}/4 |& tee "$RUNNER_TEMP/cf-root-shard-${{ matrix.shard }}.log"

      - name: CF shard diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          echo "=== CF root shard ${{ matrix.shard }} diagnostics ==="
          node --version
          pnpm --version
          tail -240 "$RUNNER_TEMP/cf-root-shard-${{ matrix.shard }}.log" || true

      - name: Publish CF shard summary
        if: ${{ always() }}
        run: |
          {
            echo "### CF root shard ${{ matrix.shard }}/4"
            tail -20 "$RUNNER_TEMP/cf-root-shard-${{ matrix.shard }}.log" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CF shard log
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cf-root-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cf-root-shard-${{ matrix.shard }}.log
          if-no-files-found: warn

  cf-packages:
    needs: [changes, cf-preflight]
    if: needs.changes.outputs.cf == 'true' || needs.changes.outputs.parity_cf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cloudflare package tests
        env:
          OMA_CF_VITEST_MAX_WORKERS: 1
          OMA_CF_VITEST_SERIAL: "1"
          OMA_CF_VITEST_VERBOSE: "1"
        run: |
          set -o pipefail
          pnpm test:ci:cf:packages |& tee "$RUNNER_TEMP/cf-package-tests.log"

      - name: Publish CF package summary
        if: ${{ always() }}
        run: |
          {
            echo "### Cloudflare package tests"
            tail -20 "$RUNNER_TEMP/cf-package-tests.log" || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CF package log
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cf-package-tests-${{ github.run_id }}
          path: ${{ runner.temp }}/cf-package-tests.log
          if-no-files-found: warn

  # Fast, deterministic checks run before the long Node lanes. Every dependent
  # lane reuses this gate so lockfile and dependency-boundary failures are
  # reported without spending time on tests.
  lint:
    needs: changes
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.parity_node == 'true' || needs.changes.outputs.cf == 'true' || needs.changes.outputs.parity_cf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Structural lint
        run: pnpm lint

  node-preflight:
    needs: [changes, lint]
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.parity_node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check dependency sources before install
        run: |
          node --test scripts/check-dependency-sources.test.mjs
          node scripts/check-dependency-sources.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency boundaries
        run: node scripts/check-core-boundaries.mjs

      - name: Node typecheck
        run: pnpm typecheck:ci:node

  # The package suite is intentionally split into independently retryable
  # groups. Keep each command explicit so a failed group is easy to identify.
  node-unit:
    needs: [changes, node-preflight]
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.parity_node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [checks, core, stores, runtime, applications, adapters, openai]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install native storage test dependency
        if: matrix.group == 'applications'
        run: bash scripts/install-ci-rclone.sh

      - name: Node unit tests (${{ matrix.group }})
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.group }}" in
            checks)
              pnpm run test:discovery
              pnpm run test:architecture
              pnpm run test:self-host
              pnpm run test:certification:runner
              pnpm run test:certification:orchestrators
              pnpm run test:certification:offline
              pnpm run test:provider-chaos
              pnpm run test:console
              pnpm run test:resource-convergence:node
              ;;
            core)
              pnpm --filter @open-managed-agents/auth test
              pnpm --filter @open-managed-agents/matter test
              pnpm --filter @open-managed-agents/execution-control test
              pnpm --filter @open-managed-agents/managed-agents-api test:official-worker
              pnpm --filter @open-managed-agents/environment-work-store-memory test
              pnpm --filter @open-managed-agents/environment-work-store-sql test
              ;;
            stores)
              pnpm --filter @open-managed-agents/agent-store-sql --filter @open-managed-agents/credential-store-sql --filter @open-managed-agents/deployment-store-sql --filter @open-managed-agents/deployment-run-store-sql --filter @open-managed-agents/dream-store-sql --filter @open-managed-agents/environment-store-sql --filter @open-managed-agents/file-store-sql --filter @open-managed-agents/memory-document-store-sql --filter @open-managed-agents/memory-store-store-sql --filter @open-managed-agents/session-resource-store-sql --filter @open-managed-agents/session-thread-store-sql --filter @open-managed-agents/skill-store-sql --filter @open-managed-agents/tunnel-store-sql --filter @open-managed-agents/user-profile-store-sql --filter @open-managed-agents/vault-store-sql test
              ;;
            runtime)
              pnpm --filter '@open-managed-agents/environment-activation-*' test
              pnpm --filter '@open-managed-agents/environment-dispatch-*' test
              pnpm --filter @open-managed-agents/harness-supervisor test
              pnpm --filter @open-managed-agents/harness-runtime-acp test
              pnpm --filter '@open-managed-agents/managed-runtime-*' test
              pnpm --filter @open-managed-agents/vercel-sandbox-contract test
              pnpm --filter @open-managed-agents/sandbox-orphan-store-sql test
              pnpm --filter @open-managed-agents/harness-inference-adapters test
              pnpm --filter @open-managed-agents/inference-proxy test
              pnpm --filter @open-managed-agents/acp-runtime test
              pnpm --filter @open-managed-agents/runtime test
              pnpm --filter @open-managed-agents/harbor-tasks test
              pnpm --filter @open-managed-agents/evals-runner test
              pnpm --filter @open-managed-agents/session-runtime test
              pnpm --filter @open-managed-agents/session-outcomes test
              pnpm --filter @open-managed-agents/session-subagents test
              pnpm --filter @open-managed-agents/session-runtime-sql test
              pnpm --filter @open-managed-agents/session-event-store-sql test
              pnpm --filter @open-managed-agents/sandbox test
              pnpm --filter @open-managed-agents/sandbox-port-kit test
              pnpm --filter '@open-managed-agents/sandbox-adapter-*' test
              pnpm --filter '@open-managed-agents/node-database-*' test
              ;;
            applications)
              pnpm --filter @open-managed-agents/http-routes test:node
              pnpm --filter @open-managed-agents/managed-credential-resolver test:node
              pnpm --filter @openma/cli test
              pnpm --filter @openma/sdk test
              pnpm --filter @open-managed-agents/main-node test
              pnpm --filter @open-managed-agents/main-fly test
              pnpm --filter @open-managed-agents/main-vercel test
              pnpm --filter @open-managed-agents/cap test
              ;;
            adapters)
              pnpm --filter @open-managed-agents/integrations-adapters-node test
              pnpm --filter @open-managed-agents/integrations-adapters-cf test
              pnpm --filter @open-managed-agents/managed-agents-adapters-sql test
              pnpm --filter @open-managed-agents/managed-agents-adapters-blob test
              pnpm --filter @open-managed-agents/managed-agents-adapters-runtime test
              ;;
            openai)
              pnpm run test:openai-agents
              ;;
            *)
              echo "Unknown test group: ${{ matrix.group }}" >&2
              exit 1
              ;;
          esac

  # Playwright's official image includes the browser and OS libraries. Pin it
  # to the version in pnpm-lock.yaml so this lane never runs apt-get online.
  browser-e2e:
    needs: [changes, node-preflight]
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.parity_node == 'true'
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Console Agent editor E2E
        run: pnpm test:e2e:agent-editor

  # Host-only integrations retain access to /dev/kvm and Docker. Browser
  # binaries are installed without --with-deps; the runner supplies the OS
  # libraries, and the Playwright container above owns the browser E2E lane.
  node-integration:
    needs: [changes, node-preflight]
    if: needs.changes.outputs.node == 'true' || needs.changes.outputs.parity_node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install native storage test dependency
        run: bash scripts/install-ci-rclone.sh

      - name: Native sandbox bootstrap safety
        timeout-minutes: 2
        working-directory: packages/sandbox-adapter-e2b
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Ur env OMA_REQUIRE_NATIVE_BOOTSTRAP=1 node ../../node_modules/vitest/vitest.mjs run --config vitest.config.ts test/managed-bootstrap.test.ts

      - name: Install browser binary
        run: pnpm exec playwright install chromium

      - name: Protocol coverage gate
        run: pnpm test:coverage:protocol

      - name: Harness web HTTP coverage (#281)
        run: pnpm test:coverage:harness-web-http

      - name: Upload harness web HTTP coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/harness-web-http/lcov.info,coverage/harness-tools-wiring/lcov.info
          flags: harness_web_http
          name: harness-web-http
          fail_ci_if_error: true
          verbose: true

      - name: Storage integration tests
        run: pnpm test:integration:storage

      - name: Enable KVM for Litebox
        uses: ./.github/actions/enable-kvm

      - name: Domain-scoped tests (changed layer + one surrounding layer)
        if: needs.changes.outputs.domain_test_commands != ''
        timeout-minutes: 15
        env:
          DOMAIN_TEST_COMMANDS: ${{ needs.changes.outputs.domain_test_commands }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [[ -z "$cmd" ]] && continue
            echo "::group::$cmd"
            bash -c "$cmd"
            echo "::endgroup::"
          done <<< "$DOMAIN_TEST_COMMANDS"

      - name: Console local E2E (main-node)
        if: needs.changes.outputs.console_e2e == 'true' && needs.changes.outputs.console_local_specs != ''
        timeout-minutes: 15
        env:
          OMA_E2E_REQUIRE_BACKEND: "1"
          OMA_E2E_STATE_DIR: ${{ runner.temp }}/oma-console-e2e
        run: |
          set -euo pipefail
          test/e2e/start-local-backend.sh
          export OMA_E2E_LOCAL_API_KEY="$(cat "$OMA_E2E_STATE_DIR/api-key")"
          trap 'kill "$(cat "$OMA_E2E_STATE_DIR/main-node.pid")" 2>/dev/null || true' EXIT
          pnpm exec playwright test ${{ needs.changes.outputs.console_local_specs }} --config=playwright.config.ts --workers=1

      - name: Console certification browser E2E
        if: needs.changes.outputs.console_e2e == 'true' && needs.changes.outputs.console_cert_specs != ''
        timeout-minutes: 15
        env:
          OMA_LOCAL_RELEASE_ONLY: console-browser
          OMA_E2E_REQUIRE_BACKEND: "1"
          OMA_E2E_CONSOLE_CERT_SPECS: ${{ needs.changes.outputs.console_cert_specs }}
        run: node scripts/local-release-certification.mjs

      - name: MySQL integration tests
        run: pnpm test:integration:mysql

      - name: MySQL custom-tool authority integration
        env:
          MYSQL_DATABASE: openma_custom_test_ci
          MYSQL_ROOT_PASSWORD: openma-ci
          CUSTOM_INVOCATIONS_MYSQL_URL: mysql://root:openma-ci@127.0.0.1:3307/openma_custom_test_ci
        run: |
          set -euo pipefail
          container="openma-custom-authority-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --publish 127.0.0.1:3307:3306 --env MYSQL_DATABASE="$MYSQL_DATABASE" --env MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" mysql:8.4
          for attempt in $(seq 1 60); do
            if docker exec "$container" mysqladmin ping --host=127.0.0.1 --user=root --password="$MYSQL_ROOT_PASSWORD" --silent; then break; fi
            if [ "$attempt" = 60 ]; then echo 'MySQL did not become ready' >&2; exit 1; fi
            sleep 2
          done
          export CUSTOM_INVOCATIONS_MYSQL_URL
          pnpm --filter @open-managed-agents/managed-agents-adapters-sql exec vitest run --config vitest.custom-mysql.config.ts

      - name: PostgreSQL MCP access-loss integration
        run: pnpm --filter @open-managed-agents/main-node test:integration:postgres

  # Required check name stays `node`; this aggregate lets failed lanes be
  # retried independently while preserving a single branch-protection context.
  node:
    needs: [changes, node-preflight, node-unit, browser-e2e, node-integration]
    if: always() && (needs.changes.outputs.node == 'true' || needs.changes.outputs.parity_node == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all Node lanes
        run: |
          for lane in \
            "preflight=${{ needs.node-preflight.result }}" \
            "unit=${{ needs.node-unit.result }}" \
            "browser=${{ needs.browser-e2e.result }}" \
            "integration=${{ needs.node-integration.result }}"; do
            echo "$lane"
            if [[ "$lane" != *=success ]]; then
              echo "Node lane did not pass: $lane" >&2
              exit 1
            fi
          done

  # Separate from graded surfaces so it does not wait on the heavy suites and
  # does not use the Litebox /dev/kvm action. Checkout plus a Node script only.
  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the base branch and tags
        run: git fetch origin "${{ github.base_ref }}" --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Test the release check
        run: node --test scripts/release-check.test.mjs scripts/release-check.history.test.mjs

      - name: Check changesets and unreleased pull requests
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/release-check.mjs

  # Required check name stays `verify` (branch protection). Skipped surfaces
  # count as success so docs-only / CF-only / Node-only PRs still pass.
  verify:
    needs: [changes, docs, web, cf, node, release-check, lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate required check
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "web=${{ needs.web.result }}"
          echo "cf=${{ needs.cf.result }}"
          echo "node=${{ needs.node.result }}"
          echo "release-check=${{ needs.release-check.result }}"
          echo "lint=${{ needs.lint.result }}"
          echo "meta_only=${{ needs.changes.outputs.meta_only }}"

          fail=0
          check() {
            local name="$1"
            local result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK $name ($result)"
              return 0
            fi
            echo "FAIL $name ($result)"
            fail=1
          }

          check changes "${{ needs.changes.result }}"
          check docs "${{ needs.docs.result }}"
          check web "${{ needs.web.result }}"
          check cf "${{ needs.cf.result }}"
          check node "${{ needs.node.result }}"
          check release-check "${{ needs.release-check.result }}"
          check lint "${{ needs.lint.result }}"

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
