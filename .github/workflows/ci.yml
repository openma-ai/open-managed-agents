name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Merge Queue: required check context remains `verify`.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  # Graded impact surfaces (#417). Decision table lives in
  # scripts/ci-impact-surfaces.mjs (unit-tested).
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
      web: ${{ steps.classify.outputs.web }}
      cf: ${{ steps.classify.outputs.cf }}
      node: ${{ steps.classify.outputs.node }}
      meta_only: ${{ steps.classify.outputs.meta_only }}
      console_e2e: ${{ steps.console_scope.outputs.console_e2e }}
      console_domains: ${{ steps.console_scope.outputs.console_domains }}
      console_local_specs: ${{ steps.console_scope.outputs.console_local_specs }}
      console_cert_specs: ${{ steps.console_scope.outputs.console_cert_specs }}
      domain_test_commands: ${{ steps.console_scope.outputs.domain_test_commands }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Resolve change list
        id: files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            BASE="origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # Merge Queue temporary ref: classify against the queue base SHA.
            BASE="${{ github.event.merge_group.base_sha }}"
            if [[ -z "$BASE" ]]; then
              echo "merge_group.base_sha missing" >&2
              exit 1
            fi
          else
            # Push to main: classify against the previous commit on this ref.
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
              BASE="$(git rev-parse HEAD^)"
            fi
          fi
          git diff --name-only --diff-filter=ACMRD "$BASE"...HEAD > /tmp/ci-changed-files.txt
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Changed files vs $BASE:"
          cat /tmp/ci-changed-files.txt
          if [[ ! -s /tmp/ci-changed-files.txt ]]; then
            echo "No changed files; treating as empty (meta-only)."
          fi

      - name: Classify impact surfaces
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ci-impact-surfaces.test.mjs
          node scripts/ci-impact-surfaces.mjs --write-github-output < /tmp/ci-changed-files.txt

      # Console browser E2E is scoped by domain: the changed domain's Console
      # specs and suites for the changed layer plus its adjacent layers
      # (frontend<->backend<->storage/cli/sdk) within the same domain.
      - name: Select Console E2E domains
        id: console_scope
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ci-console-e2e-scope.test.mjs
          node scripts/ci-console-e2e-scope.mjs --write-github-output < /tmp/ci-changed-files.txt

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Docs typecheck
        run: pnpm --filter open-managed-agents-docs typecheck

      - name: Docs build
        run: pnpm build:docs

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web typecheck
        run: pnpm --filter @open-managed-agents/web typecheck

      - name: Web test
        run: pnpm test:web

  cf:
    needs: changes
    if: needs.changes.outputs.cf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check dependency sources before install
        run: |
          node --test scripts/check-dependency-sources.test.mjs
          node scripts/check-dependency-sources.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CF typecheck
        run: pnpm typecheck:ci:cf

      - name: CF tests
        run: pnpm test:ci:cf

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    # Full Node suite plus browser, storage and MySQL integration; allow cleanup.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Check dependency sources before install
        run: |
          node --test scripts/check-dependency-sources.test.mjs
          node scripts/check-dependency-sources.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Node typecheck
        run: pnpm typecheck:ci:node

      - name: Node tests
        run: pnpm test:ci:node

      # `--with-deps` runs apt-get against azure.archive.ubuntu.com. On
      # 2026-10-26 that mirror served ~39 kB/s and this step took 11 min while
      # the Playwright CDN download took ~6 s. Bound apt with per-request
      # timeouts and retries, and cap the whole step so a slow mirror fails
      # fast instead of eating the job budget. (The official Playwright
      # container image is not used because this job also needs host /dev/kvm
      # for Litebox and the host database integration setup.)
      - name: Install browser for Console E2E
        timeout-minutes: 5
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null
          pnpm exec playwright install --with-deps chromium

      - name: Console Agent editor E2E
        run: pnpm test:e2e:agent-editor

      - name: Protocol coverage gate
        run: pnpm test:coverage:protocol

      - name: Harness web HTTP coverage (#281)
        run: pnpm test:coverage:harness-web-http

      - name: Upload harness web HTTP coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/harness-web-http/lcov.info,coverage/harness-tools-wiring/lcov.info
          flags: harness_web_http
          name: harness-web-http
          fail_ci_if_error: true
          verbose: true

      - name: Storage integration tests
        run: pnpm test:integration:storage

      # The official two-owner persistence test runs real Litebox microVMs.
      # Litebox aborts its host process when /dev/kvm is not accessible.
      #
      # ubuntu-24.04 runners expose /dev/kvm as root:kvm mode 0660, and the
      # runner user is not in the kvm group. `udevadm trigger` applies a
      # 0666 rule asynchronously: the access check failed ~26ms after
      # trigger, while the mode change landed ~45ms later. `udevadm settle`
      # can also return before that uevent is queued. chmod is synchronous.
      # The udev rule keeps a later uevent from restoring 0660. A missing
      # device fails this step with an explicit error, which fails the job.
      # Script: .github/actions/enable-kvm (also used by release.yml).
      - name: Enable KVM for Litebox
        uses: ./.github/actions/enable-kvm

      # ── Console browser E2E (domain-scoped; mock LLM only) ──────────────
      # Never calls a real model provider: local specs need no model, and the
      # certification lane points agents at the in-process mock LLM server.
      # Throwaway API_KEY / PLATFORM_ROOT_SECRET are generated per run.
      - name: Domain-scoped tests (changed layer + one surrounding layer)
        if: needs.changes.outputs.domain_test_commands != ''
        timeout-minutes: 15
        env:
          DOMAIN_TEST_COMMANDS: ${{ needs.changes.outputs.domain_test_commands }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [[ -z "$cmd" ]] && continue
            echo "::group::$cmd"
            bash -c "$cmd"
            echo "::endgroup::"
          done <<< "$DOMAIN_TEST_COMMANDS"

      - name: Console local E2E (main-node)
        if: needs.changes.outputs.console_e2e == 'true' && needs.changes.outputs.console_local_specs != ''
        timeout-minutes: 15
        env:
          OMA_E2E_REQUIRE_BACKEND: "1"
          OMA_E2E_STATE_DIR: ${{ runner.temp }}/oma-console-e2e
        run: |
          set -euo pipefail
          test/e2e/start-local-backend.sh
          export OMA_E2E_LOCAL_API_KEY="$(cat "$OMA_E2E_STATE_DIR/api-key")"
          trap 'kill "$(cat "$OMA_E2E_STATE_DIR/main-node.pid")" 2>/dev/null || true' EXIT
          pnpm exec playwright test ${{ needs.changes.outputs.console_local_specs }} \
            --config=playwright.config.ts --workers=1

      - name: Console certification browser E2E
        if: needs.changes.outputs.console_e2e == 'true' && needs.changes.outputs.console_cert_specs != ''
        timeout-minutes: 15
        env:
          OMA_LOCAL_RELEASE_ONLY: console-browser
          OMA_E2E_REQUIRE_BACKEND: "1"
          OMA_E2E_CONSOLE_CERT_SPECS: ${{ needs.changes.outputs.console_cert_specs }}
        run: node scripts/local-release-certification.mjs

      - name: MySQL integration tests
        run: pnpm test:integration:mysql

      - name: PostgreSQL integration tests (including sandbox and execution contracts)
        run: pnpm --filter @open-managed-agents/main-node test:integration:postgres

  # Run ownership contracts independently so a preceding browser/provider
  # failure cannot prevent the real database checks from producing evidence.
  database-contracts:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Check dependency sources before install
        run: node scripts/check-dependency-sources.mjs
      - run: pnpm install --frozen-lockfile
      - name: Session execution and sandbox ownership contracts on real SQL
        run: pnpm --filter @open-managed-agents/main-node test:integration:${{ matrix.database }} test/issue-525.${{ matrix.database }}.integration.ts

  # Separate from graded surfaces so it does not wait on the heavy suites and
  # does not use the Litebox /dev/kvm action. Checkout plus a Node script only.
  release-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch the base branch and tags
        run: git fetch origin "${{ github.base_ref }}" --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Test the release check
        run: node --test scripts/release-check.test.mjs scripts/release-check.history.test.mjs

      - name: Check changesets and unreleased pull requests
        env:
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/release-check.mjs

  # Required check name stays `verify` (branch protection). Skipped surfaces
  # count as success so docs-only / CF-only / Node-only PRs still pass.
  verify:
    needs: [changes, docs, web, cf, node, database-contracts, release-check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Gate required check
        shell: bash
        run: |
          set -euo pipefail
          echo "changes=${{ needs.changes.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "web=${{ needs.web.result }}"
          echo "cf=${{ needs.cf.result }}"
          echo "node=${{ needs.node.result }}"
          echo "database-contracts=${{ needs.database-contracts.result }}"
          echo "release-check=${{ needs.release-check.result }}"
          echo "meta_only=${{ needs.changes.outputs.meta_only }}"

          fail=0
          check() {
            local name="$1"
            local result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK $name ($result)"
              return 0
            fi
            echo "FAIL $name ($result)"
            fail=1
          }

          check changes "${{ needs.changes.result }}"
          check docs "${{ needs.docs.result }}"
          check web "${{ needs.web.result }}"
          check cf "${{ needs.cf.result }}"
          check node "${{ needs.node.result }}"
          check database-contracts "${{ needs.database-contracts.result }}"
          check release-check "${{ needs.release-check.result }}"

          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
