# Self-host OMA — single-instance docker-compose for local trials and small
# self-host deploys. Uses SQLite + local FS for storage; if you outgrow
# this (multi-instance, real DB, S3 blob) swap in services for postgres /
# minio and point the env vars accordingly (see docs/self-host.md).
#
# Quick start:
#   1. Copy .env.example → .env (fill ANTHROPIC_API_KEY)
#   2. docker compose -f docker-compose.yml up --build
#   3. curl localhost:8787/health
#
# Persistence: ./data on the host is bind-mounted at /app/data in the
# container, so kill -9 / docker stop don't lose sessions or workdirs.

services:
  # One-shot, exits before oma-server starts. Docker creates a missing
  # bind-mount source directory as root:root 0755, but the server runs as
  # uid 1000 (`node`) and binds ./data at /app/data — so on a fresh
  # checkout better-sqlite3 cannot open /app/data/oma.db, the process
  # exits with SQLITE_CANTOPEN, `restart: unless-stopped` loops it, and
  # /health never passes. This fixes the ownership first.
  oma-init:
    image: openma/main-node:dev
    container_name: oma-init
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /app/data
        # Fast path: already ours, skip a recursive chown on every restart.
        if [ "$$(stat -c %u /app/data)" = "1000" ]; then
          echo "oma-init: /app/data is already owned by uid 1000"
          exit 0
        fi
        echo "oma-init: taking ownership of /app/data for uid 1000"
        chown -R 1000:1000 /app/data
    volumes:
      - ./data:/app/data
    # Runs to completion and stays stopped. It exits non-zero — blocking
    # oma-server — only when the mount cannot be chowned (e.g. NFS with
    # root squash); chown ./data on the host instead.
    restart: "no"

  oma-server:
    build:
      context: .
      dockerfile: apps/main-node/Dockerfile
      args:
        # Vendor SDKs the selected adapters import lazily. They are optional
        # peers, so the image installs none unless named here — without it
        # `SANDBOX_PROVIDER=e2b` starts fine and then fails on the first
        # session turn. `boxrun` needs none (it calls `boxlite serve`).
        SANDBOX_PROVIDERS: ${SANDBOX_PROVIDERS:-}
    image: openma/main-node:dev
    container_name: oma-server
    ports:
      - "${OMA_PORT:-8787}:8787"
    env_file:
      - path: ./.env
        required: false
    environment:
      # Required for harness turns. Put it in .env or pass via shell env.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional Anthropic-compat proxy settings belong in .env
      # (ANTHROPIC_BASE_URL / ANTHROPIC_CUSTOM_HEADERS). Do NOT default
      # them to "" here — @ai-sdk/anthropic validates baseURL on
      # module init and rejects empty string.
      # Storage paths inside the container — mapped to ./data on host.
      # All absolute so they don't surprise-resolve relative to pnpm's
      # cwd (which becomes /app/apps/main-node under `pnpm --filter ... start`).
      DATABASE_PATH: /app/data/oma.db
      AUTH_DATABASE_PATH: /app/data/auth.db
      SANDBOX_WORKDIR: /app/data/sandboxes
      MEMORY_BLOB_DIR: /app/data/memory-blobs
      # Backing dir for /mnt/session/outputs/ — AMA-aligned magic dir the
      # agent uses to deliver downloadable artefacts. Bind-mounted into
      # ./data so files survive `docker stop`.
      SESSION_OUTPUTS_DIR: /app/data/session-outputs
      # Local FS blob store for uploaded files. When FILES_S3_ENDPOINT is
      # set the S3 backend is used instead and this var is ignored.
      FILES_BLOB_DIR: /app/data/files-blobs
      # Required: deployable entrypoints do not expose the non-isolated
      # local subprocess test adapter.
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:?Set SANDBOX_PROVIDER to an isolated provider}
      # Vault egress uses the normal HTTPS API; the sandbox owns interception.
      # Auth: better-auth sqlite-backed. AUTH_DISABLED=1 bypasses entirely
      # (all requests become tenant_id="default") for local single-user
      # demos. BETTER_AUTH_SECRET signs cookies; generate with
      # `openssl rand -hex 32` and put in .env.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Console → Integrations → Feishu talks to the `matter` service
      # through /matter/*. Empty: the page says Feishu is not set up.
      # With the `feishu` profile set MATTER_URL=http://matter:4720 in .env.
      MATTER_URL: ${MATTER_URL:-}
      MATTER_PROXY_SECRET: ${MATTER_PROXY_SECRET:-}
    volumes:
      - ./data:/app/data
    depends_on:
      oma-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Healthcheck queries /health every 30s. unhealthy after 3 misses
    # (90s grace), at which point Docker / your orchestrator can decide
    # to restart.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # OpenMatter for Feishu: the "Connect Feishu" flow, one long connection per
  # connected app, and the MCP server whose reply tool the Agent calls.
  # Opt-in: `docker compose --profile feishu up`. Needs in .env:
  #   MATTER_URL=http://matter:4720, MATTER_PROXY_SECRET, MATTER_SECRET_KEY,
  #   MATTER_OMA_API_KEY (an API key of the workspace it serves) and
  #   MATTER_OMA_ENVIRONMENT_ID (the environment chat sessions run in).
  matter:
    profiles: ["feishu"]
    image: openma/main-node:dev
    container_name: oma-matter
    working_dir: /app/apps/matter
    command: ["pnpm", "start"]
    # Missing settings make it exit with the list of problems (see logs).
    environment:
      MATTER_HOST: 0.0.0.0
      MATTER_PORT: "4720"
      MATTER_DATA_DIR: /app/data/matter
      # mysql://… to keep state in MySQL instead (required for >1 replica).
      MATTER_DATABASE_URL: ${MATTER_DATABASE_URL:-}
      MATTER_PROXY_SECRET: ${MATTER_PROXY_SECRET:-}
      MATTER_SECRET_KEY: ${MATTER_SECRET_KEY:-}
      OMA_URL: http://oma-server:8787
      OMA_API_KEY: ${MATTER_OMA_API_KEY:-}
      OMA_TENANT_ID: ${MATTER_OMA_TENANT_ID:-default}
      OMA_ENVIRONMENT_ID: ${MATTER_OMA_ENVIRONMENT_ID:-}
      # Where OpenMA's harness reaches the MCP endpoint.
      MATTER_MCP_URL: http://matter:4720/mcp
      # Where GitLab reaches this service for webhooks (optional).
      MATTER_PUBLIC_URL: ${MATTER_PUBLIC_URL:-}
      # GitLab instances offered when linking a Bond, comma-separated (optional).
      MATTER_GITLAB_URLS: ${MATTER_GITLAB_URLS:-}
    volumes:
      - ./data:/app/data
    depends_on:
      oma-server:
        condition: service_started
    restart: unless-stopped
